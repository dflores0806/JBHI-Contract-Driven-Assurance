[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jbhi-contract-driven-assurance"
version = "1.0.0"
description = "Reproducibility package for contract-driven assurance and runtime verification of Health Digital Twins"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "requests>=2.31"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
